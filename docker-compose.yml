version: "3.9"

services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: flownocode-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flownocode
      POSTGRES_USER: flownocode
      POSTGRES_PASSWORD: flownocode
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flownocode -d flownocode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    driver: local
